services:
  mongodb:
    image: mongo:7
    container_name: brahma-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brahma-backend
    restart: always
    ports:
      - "3005:3005"
      - "3006:3006"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/brahma
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brahma-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
