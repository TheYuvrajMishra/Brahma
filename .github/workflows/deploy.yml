name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        id: validate_secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USERNAME }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping deployment because VPS secrets are not fully configured (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS via SSH
        if: steps.validate_secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ~/Brahma || cd /var/www/Brahma || cd /app/Brahma

            # Fetch and pull latest changes from main/master branch
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            # Detect docker compose CLI command
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi

            # Rebuild without cache to ensure fresh frontend/backend builds
            $DOCKER_COMPOSE build --no-cache
            $DOCKER_COMPOSE up -d --force-recreate

            # Prune unused docker images to save VPS disk space
            docker image prune -f
