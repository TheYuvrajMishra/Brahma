name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }} # Optional if SSH key has password
          port: 22
          script: |
            cd Brahma
            git pull origin main || git pull origin master
            if [ ! -f backend/.env ]; then
              echo "Creating fallback backend/.env file on VPS..."
              touch backend/.env
            fi
            docker compose down || docker-compose down
            docker compose up --build -d || docker-compose up --build -d || { echo "Docker Compose Up Failed! Printing logs..."; docker compose logs --tail=100 || docker-compose logs --tail=100; exit 1; }
            docker image prune -f
